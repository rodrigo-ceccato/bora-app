# Production overlay: terminates TLS with Caddy and tunes PostgreSQL for a small VM.
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# Requires BORA_DOMAIN in .env, and BORA_BIND=127.0.0.1 so the plain-HTTP web
# container is only reachable through Caddy.
services:
  database:
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=25
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB

  api:
    environment:
      # Production requests traverse Caddy and nginx before reaching the API.
      # release.sh also requires the web port to remain loopback-bound.
      BORA_TRUST_PROXY_HOPS: ${BORA_TRUST_PROXY_HOPS:-2}

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BORA_DOMAIN: ${BORA_DOMAIN:?set BORA_DOMAIN in .env}
      BORA_TLS_EMAIL: ${BORA_TLS_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
