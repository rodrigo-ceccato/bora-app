name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: docker compose config
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build
      - run: curl --retry 10 --retry-all-errors --retry-delay 1 --fail http://127.0.0.1:8080/api/health
      - run: npm run test:e2e
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bora-ui-screenshots
          path: test-results/**/*.png
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: docker compose down -v
