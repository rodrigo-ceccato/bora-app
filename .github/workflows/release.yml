name: Release deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    outputs:
      tag_sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Validate stable tag from main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" == tag ]]
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          node scripts/validate-release-tag.mjs "$RELEASE_TAG"
      - id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify:static
      - run: npm run verify
      - run: npm run verify:ops
      - run: npm run test:migrations
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: docker compose up -d --build
        env:
          BORA_RATE_LIMIT_SCALE: '100'
      - run: ./deploy/smoke-release.sh http://127.0.0.1:8080 'release-candidate Compose route'
      - run: npm run test:e2e:full
      - name: Generate SBOMs and scan local release images
        run: npm run verify:images
      - name: Upload image SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bora-image-sboms-${{ github.ref_name }}
          path: .artifacts/sbom/*.spdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bora-playwright-results-${{ github.ref_name }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: docker compose down -v

  publish:
    name: Publish release images
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.api
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/rodrigo-ceccato/bora-api:${{ github.ref_name }}
            ghcr.io/rodrigo-ceccato/bora-api:${{ needs.verify.outputs.tag_sha }}
      - id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.web
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/rodrigo-ceccato/bora-web:${{ github.ref_name }}
            ghcr.io/rodrigo-ceccato/bora-web:${{ needs.verify.outputs.tag_sha }}

  deploy:
    name: Deploy production
    needs: [verify, publish]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.BORA_DOMAIN }}
    env:
      BORA_HOST: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
      BORA_REMOTE_DIR: ${{ vars.DEPLOY_PATH }}
      BORA_API_IMAGE: ghcr.io/rodrigo-ceccato/bora-api@${{ needs.publish.outputs.api_digest }}
      BORA_WEB_IMAGE: ghcr.io/rodrigo-ceccato/bora-web@${{ needs.publish.outputs.web_digest }}
      BORA_RELEASE_TAG: ${{ github.ref_name }}
      BORA_RELEASE_SHA: ${{ needs.verify.outputs.tag_sha }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      BORA_PORT: ${{ vars.BORA_PORT }}
      BORA_BIND: ${{ vars.BORA_BIND }}
      BORA_TRUST_PROXY_HOPS: '2'
      BORA_DOMAIN: ${{ vars.BORA_DOMAIN }}
      BORA_TLS_EMAIL: ${{ secrets.BORA_TLS_EMAIL }}
      DUCKDNS_DOMAIN: ${{ vars.DUCKDNS_DOMAIN }}
      DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
      BORA_VAPID_PUBLIC_KEY: ${{ vars.BORA_VAPID_PUBLIC_KEY }}
      BORA_VAPID_PRIVATE_KEY: ${{ secrets.BORA_VAPID_PRIVATE_KEY }}
      BORA_VAPID_SUBJECT: mailto:${{ secrets.BORA_TLS_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
      - name: Configure verified SSH access
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy digest-pinned release
        run: ./deploy/release.sh

  release:
    name: Publish GitHub Release
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.verify.outputs.tag_sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          git cat-file -p "refs/tags/$RELEASE_TAG" | sed '1,/^$/d' > release-notes.md
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md --target "$RELEASE_SHA"
