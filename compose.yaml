services:
  database:
    image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bora}
      POSTGRES_USER: ${POSTGRES_USER:-bora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - bora_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Local Compose builds this name; release deployments set a digest-pinned
    # BORA_API_IMAGE from GitHub Actions and run without --build.
    image: ${BORA_API_IMAGE:-bora-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 8787
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-bora}
      PGUSER: ${POSTGRES_USER:-bora}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      DATABASE_POOL_SIZE: 10
      BORA_VAPID_PUBLIC_KEY: ${BORA_VAPID_PUBLIC_KEY:-}
      BORA_VAPID_PRIVATE_KEY: ${BORA_VAPID_PRIVATE_KEY:-}
      BORA_VAPID_SUBJECT: ${BORA_VAPID_SUBJECT:-}
      BORA_RATE_LIMIT_SCALE: ${BORA_RATE_LIMIT_SCALE:-1}
      # Local Compose has nginx directly in front of the API. Running the API
      # outside Compose omits this variable and keeps the secure direct default 0.
      BORA_TRUST_PROXY_HOPS: ${BORA_TRUST_PROXY_HOPS:-1}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    # Local Compose builds this name; release deployments set a digest-pinned
    # BORA_WEB_IMAGE from GitHub Actions and run without --build.
    image: ${BORA_WEB_IMAGE:-bora-web:local}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      # Behind a TLS proxy, set BORA_BIND=127.0.0.1 so plain HTTP is not public.
      - "${BORA_BIND:-0.0.0.0}:${BORA_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    profiles: ["test"]
    environment:
      # Avoid the host-only Chromium executable override in playwright.config.
      CI: "1"
      PLAYWRIGHT_BASE_URL: http://web
    depends_on:
      web:
        condition: service_started

volumes:
  bora_database:
