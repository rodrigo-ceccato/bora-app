services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bora}
      POSTGRES_USER: ${POSTGRES_USER:-bora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - bora_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # Local Compose builds this name; release deployments set a digest-pinned
    # BORA_API_IMAGE from GitHub Actions and run without --build.
    image: ${BORA_API_IMAGE:-bora-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 8787
      PGHOST: database
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-bora}
      PGUSER: ${POSTGRES_USER:-bora}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
      DATABASE_POOL_SIZE: 10
      BORA_VAPID_PUBLIC_KEY: ${BORA_VAPID_PUBLIC_KEY:-}
      BORA_VAPID_PRIVATE_KEY: ${BORA_VAPID_PRIVATE_KEY:-}
      BORA_VAPID_SUBJECT: ${BORA_VAPID_SUBJECT:-}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    # Local Compose builds this name; release deployments set a digest-pinned
    # BORA_WEB_IMAGE from GitHub Actions and run without --build.
    image: ${BORA_WEB_IMAGE:-bora-web:local}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      # Behind a TLS proxy, set BORA_BIND=127.0.0.1 so plain HTTP is not public.
      - "${BORA_BIND:-0.0.0.0}:${BORA_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  bora_database:
