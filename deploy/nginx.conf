log_format bora '$remote_addr - $remote_user [$time_local] '
                '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  access_log /var/log/nginx/access.log bora;

  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:;" always;

  location /api/ {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    expires -1;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 1y;
    try_files $uri =404;
  }
}
